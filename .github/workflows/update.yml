name: Update FRED
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p data
          python3 << 'PY'
          import json, urllib.request
          KEY="868312c0c2cce8f78b0bd5e57f8f172a"
          def get(sid):
              url="https://api.stlouisfed.org/fred/series/observations?series_id="+sid+"&api_key="+KEY+"&file_type=json&sort_order=desc&limit=1"
              j=json.loads(urllib.request.urlopen(url).read())
              return j['observations'][0]
          w=get("WALCL")
          t=get("WTREGEN")
          r=get("RRPONTSYD")
          walcl=float(w["value"])
          wt=float(t["value"])
          rrp=float(r["value"])
          net=walcl/1000000-wt/1000000-rrp/1000
          out={"NET_T":net,"WALCL_T":walcl/1000000,"WTREGEN_T":wt/1000000,"RRP_T":rrp/1000,"w":w,"t":t,"r":r,"updated_at":w["date"],"source":"LIVE"}
          open("data/latest.json","w").write(json.dumps(out,indent=2))
          print(out)
          PY
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/latest.json
          git commit -m "LIVE" || true
          git push
